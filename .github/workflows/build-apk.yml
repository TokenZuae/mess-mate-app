name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Capacitor Tooling
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: npm run build

      - name: Create Capacitor Config & Clean Sync Android
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tokenzuae.messmate",
            "appName": "Mess Mate Pro",
            "webDir": "dist"
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply Kotlin & Namespace Resolution Strategy
        run: |
          if [ -f android/build.gradle ]; then
            echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { if (!project.android.hasProperty('namespace') || project.android.namespace == null) { project.android.namespace = 'com.tokenzuae.messmate.' + project.name } } } }" >> android/build.gradle
            echo "configurations.all { resolutionStrategy { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' } }" >> android/build.gradle
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mess-mate-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

